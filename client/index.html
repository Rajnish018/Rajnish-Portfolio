<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />

  <!-- Primary SEO -->
  <title>
    Rajnish Kumar | AI Developer | Full Stack Developer | React Node.js Portfolio
  </title>

  <meta name="description"
    content="Rajnish Kumar is a Full Stack and AI Developer skilled in React, Next.js, Node.js, Machine Learning, and Deep Learning. Explore projects, portfolio, and real-world AI solutions." />

  <meta name="keywords"
    content="Rajnish Kumar AI Developer, Rajnish Kumar, rajnish.kumar.18, rajnish018, Rajnish Kumar portfolio, Full Stack Developer India, React Developer, Node.js Developer, Machine Learning Engineer, Deep Learning Projects" />

  <meta name="author" content="Rajnish Kumar" />

  <!-- Canonical -->
  <link rel="canonical" href="https://rajnish-kumar-portfolio.vercel.app/" />

  <!-- Open Graph (for Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title"
    content="Rajnish Kumar | AI Developer | Full Stack Developer" />
  <meta property="og:description"
    content="Explore full stack, machine learning, and deep learning projects with modern AI technologies." />
  <meta property="og:url"
    content="https://rajnish-kumar-portfolio.vercel.app/" />
  <meta property="og:image"
    content="https://rajnish-kumar-portfolio.vercel.app/og.png" />
  <meta property="og:site_name" content="Rajnish Kumar Portfolio" />

  <!-- Twitter SEO -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title"
    content="Rajnish Kumar | AI & Full Stack Developer" />
  <meta name="twitter:description"
    content="Portfolio featuring AI, machine learning, and full stack projects." />
  <meta name="twitter:image"
    content="https://rajnish-kumar-portfolio.vercel.app/og.png" />
  <!-- Optional -->
  <meta name="twitter:creator" content="@yourhandle" />

  <!-- Extra SEO -->
  <meta name="theme-color" content="#000000" />
  <meta name="application-name" content="Rajnish Kumar Portfolio" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />

  <!-- Structured Data (VERY IMPORTANT) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Rajnish Kumar",
    "url": "https://rajnish-kumar-portfolio.vercel.app/",
    "jobTitle": "Full Stack & AI Developer",
    "sameAs": [
      "https://github.com/rajnish018",
      "https://linkedin.com/in/yourprofile"
    ]
  }
  </script>

</head>

<body>
  <!-- SEO Content for Crawlers -->
  <h1 style="position:absolute; left:-9999px;">
    Rajnish Kumar - Full Stack & AI Developer specializing in React, Node.js, and Machine Learning
  </h1>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
